aid: clear-ballot
name: Clear Ballot
description: 'Clear Ballot Group, Inc. is an election technology company that builds
  transparent, verifiable voting systems for election administrators across the United
  States. Its flagship ClearVote platform spans vote-by-mail processing, in-person
  voting, ballot design, and independent post-election audit and results-verification
  software, alongside offerings for ranked-choice voting and elections-as-a-service.
  Clear Ballot operates as a closed, certified election-systems vendor rather than a
  public API platform, so this profile is identity- and security-focused: it captures
  the company''s public web presence, domain-security posture, and its published
  vulnerability-disclosure program. Surfaced as a portfolio company of Bessemer Venture
  Partners and enriched by the API Evangelist pipeline.'
